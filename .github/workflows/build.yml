name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev pkg-config

      - name: Build
        run: gcc -O2 -Wall -Wextra -o tnfs tnfs.c $(pkg-config --cflags --libs gtk+-3.0) -lpthread

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tnfs-linux
          path: tnfs

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build
        run: x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -o tnfs.exe tnfs.c -lws2_32 -ladvapi32 -mwindows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tnfs-windows
          path: tnfs.exe

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: tnfs-linux
          path: dist/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: tnfs-windows
          path: dist/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TNFS ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/linux/tnfs
            dist/windows/tnfs.exe
