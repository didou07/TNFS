name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) — leave empty to skip release'
        required: false
        default: ''

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc libgtk-3-dev pkg-config

      - name: Build
        run: |
          gcc -O2 -Wall -Wextra \
            -o tnfs tnfs.c \
            $(pkg-config --cflags --libs gtk+-3.0) \
            -lpthread

      - name: Strip binary
        run: strip tnfs

      - uses: actions/upload-artifact@v4
        with:
          name: tnfs-linux
          path: tnfs
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mingw-w64

      - name: Build
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra \
            -o tnfs.exe tnfs.c \
            -lws2_32 -ladvapi32 \
            -mwindows \
            -static

      - name: Strip binary
        run: x86_64-w64-mingw32-strip tnfs.exe

      - uses: actions/upload-artifact@v4
        with:
          name: tnfs-windows
          path: tnfs.exe
          retention-days: 7

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: tnfs-linux
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: tnfs-windows
          path: dist/

      - name: Rename artifacts
        run: |
          mv dist/tnfs     dist/tnfs-linux-x86_64
          mv dist/tnfs.exe dist/tnfs-windows-x86_64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: TNFS ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/tnfs-linux-x86_64
            dist/tnfs-windows-x86_64.exe
