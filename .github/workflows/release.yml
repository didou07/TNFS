name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y libgtk-3-dev

      - name: Build
        run: make VERSION=${GITHUB_REF_NAME#v}

      - name: Package
        run: tar -czf tnfs-linux-x86_64.tar.gz tnfs

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: tnfs-linux-x86_64.tar.gz

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt-get install -y mingw-w64

      - name: Build
        run: make CC=x86_64-w64-mingw32-gcc OS=Windows_NT VERSION=${GITHUB_REF_NAME#v}

      - name: Package
        run: zip tnfs-windows-x86_64.zip tnfs.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: tnfs-windows-x86_64.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-build

      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            tnfs-linux-x86_64.tar.gz \
            tnfs-windows-x86_64.zip \
            --title "TNFS $GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME"
